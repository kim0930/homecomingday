<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex">
  <title>출석 체크 · 건축공학인의 밤</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css">
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Serif+KR:wght@600&display=swap">
  <link rel="stylesheet" href="styles.css">
</head>
<body class="checkin-body">
  <main class="checkin">
    <header class="checkin-head">
      <p class="eyebrow">SeoulTech Architectural Engineering</p>
      <h1>출석 체크</h1>
      <p class="checkin-lead">사전 회신에 사용한 연락처로 출석을 확인해 주세요.</p>
    </header>

    <section id="checkin-form-panel" class="checkin-card">
      <label>
        <span>연락처</span>
        <input id="checkin-phone" type="tel" inputmode="tel" autocomplete="tel" maxlength="13" placeholder="010-0000-0000" required>
      </label>
      <p id="checkin-error" class="banner warn" hidden role="alert"></p>
      <button type="button" id="checkin-btn">출석 확인</button>
      <div id="checkin-register" class="checkin-register" hidden>
        <a id="checkin-register-link" class="button" href="index.html#reply">사전 등록하러 가기</a>
        <p class="form-note">등록 후 이 페이지로 돌아와 같은 연락처로 출석 확인해 주세요.</p>
      </div>
      <p class="form-note">회신하지 않은 연락처는 아래에서 사전 등록할 수 있습니다.</p>
    </section>

    <section id="checkin-result" class="checkin-card checkin-result" hidden>
      <p id="checkin-status" class="checkin-status"></p>
      <p id="checkin-name" class="checkin-name"></p>
      <p id="checkin-meta" class="checkin-meta"></p>
      <p id="checkin-time" class="checkin-time"></p>
    </section>

    <p class="checkin-foot"><a href="index.html">행사 안내로 돌아가기</a></p>
  </main>

  <script src="rsvp-config.js"></script>
  <script src="checkin.js"></script>
</body>
</html>
