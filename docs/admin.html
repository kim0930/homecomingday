<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex">
  <title>관리자 · 건축공학인의 밤</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css">
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Serif+KR:wght@600&display=swap">
  <link rel="stylesheet" href="styles.css">
</head>
<body class="admin-body">
  <main class="admin">
    <header class="admin-head">
      <div>
        <p class="eyebrow">SeoulTech Architectural Engineering</p>
        <h1>관리자</h1>
      </div>
      <a class="text-link" href="index.html">공개 페이지</a>
    </header>

    <section id="login-panel" class="login">
      <label>
        <span>관리 비밀번호</span>
        <input id="admin-password" type="password" required autofocus autocomplete="current-password">
      </label>
      <p id="login-error" class="banner warn" hidden role="alert"></p>
      <button type="button" id="login-btn">로그인</button>
    </section>

    <section id="admin-panel" hidden aria-hidden="true"></section>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
  <script src="rsvp-config.js"></script>
  <script src="admin.js"></script>
</body>
</html>
